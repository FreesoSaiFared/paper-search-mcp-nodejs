name: chatgpt-media-relay-test
on:
  push:
    paths:
      - '.github/workflows/chatgpt-media-relay-test.yml'
  workflow_dispatch:

jobs:
  fetch-media:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact GIPHY MP4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          curl -fL --retry 3 --retry-all-errors \
            'https://media.giphy.com/media/l3V0mnnGcVblF8bAI/giphy.mp4' \
            -o artifact/giphy_test.mp4
          sha256sum artifact/giphy_test.mp4 | tee artifact/SHA256SUMS
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height -of json artifact/giphy_test.mp4 > artifact/ffprobe.json
      - name: Upload fetched bytes
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-media-relay-test
          path: artifact/
          if-no-files-found: error
          retention-days: 1
