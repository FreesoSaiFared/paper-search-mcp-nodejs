name: chatgpt-youtube-fragment-test
on:
  push:
    paths:
      - '.github/workflows/chatgpt-youtube-fragment-test.yml'

jobs:
  diagnose-cobalt:
    runs-on: ubuntu-latest
    steps:
      - name: Start ephemeral Cobalt resolver
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          docker run -d --name cobalt -p 9000:9000 \
            -e API_URL='http://127.0.0.1:9000/' \
            ghcr.io/imputnet/cobalt:latest
          for i in $(seq 1 60); do
            if curl -sS http://127.0.0.1:9000/ -o artifact/cobalt-info.json; then break; fi
            sleep 1
          done
          cat artifact/cobalt-info.json
      - name: Capture exact Cobalt response
        shell: bash
        run: |
          set -u
          CODE=$(curl -sS -o artifact/response.json -w '%{http_code}' \
            -H 'Accept: application/json' -H 'Content-Type: application/json' \
            --data '{"url":"https://www.youtube.com/watch?v=aqz-KE-bpKQ","videoQuality":"720","youtubeVideoCodec":"h264","youtubeVideoContainer":"mp4","alwaysProxy":true}' \
            http://127.0.0.1:9000/)
          printf '%s\n' "$CODE" | tee artifact/http-status.txt
          cat artifact/response.json || true
          docker logs cobalt > artifact/cobalt-container.log 2>&1 || true
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-youtube-cobalt-diagnostic
          path: artifact/
          if-no-files-found: error
          retention-days: 1
